[package]
name = "wars-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Networking: blocking WebSocket + HTTP on std threads (native) or web-sys fetch +
# WebSocket (wasm32). Both expose the same non-blocking `Deferred` API.
net = []

[dependencies]
wars-sim = { path = "../sim" }
wars-data = { path = "../data" }
wars-mapgen = { path = "../mapgen" }
wars-proto = { path = "../proto" }
wars-ai = { path = "../ai" }
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories = { workspace = true }
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "2", features = ["json"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage", "WebSocket", "MessageEvent", "BinaryType", "Event", "CloseEvent", "Request", "RequestInit", "RequestCredentials", "RequestMode", "Response", "Headers", "Location"] }
