<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wars — browser beta</title>
<style>
  :root { --bg:#181209; --panel:#2a2114; --text:#f5ebd7; --dim:#c9b99a; --accent:#f59e0b; --accent2:#b45309; --border:#5c4a2a }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font: 16px/1.5 system-ui, sans-serif }
  main { max-width: 560px; margin: 12vh auto; padding: 0 20px }
  h1 { color: var(--accent); letter-spacing:.08em; margin: 0 0 4px }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 20px 22px; margin-top: 18px }
  .btn { display:inline-block; background: var(--accent2); color:#fff; text-decoration:none; padding: 8px 14px; border-radius: 3px; border: 1px solid var(--border); margin: 8px 8px 0 0 }
  .btn:hover { background: var(--accent); color:#000 }
  .muted { color: var(--dim); font-size: 14px }
  a { color: var(--accent) }
</style>
</head>
<body>
<main>
  <h1>WARS</h1>
  <div class="muted">browser version · closed beta</div>
  <div class="card">
    <p>__MESSAGE__</p>
    <p>__ACTIONS__</p>
    <p class="muted">The desktop, Android and console versions are not affected: <a href="/">downloads and online play</a>.</p>
  </div>
</main>
</body>
</html>
