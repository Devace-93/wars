name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wars
          POSTGRES_PASSWORD: wars
          POSTGRES_DB: wars
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wars" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      WARS_TEST_DATABASE_URL: postgres://wars:wars@localhost:5432/wars
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libasound2-dev pkg-config
      - run: ./scripts/check.sh
